services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - AEMET_API_KEY=${AEMET_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
